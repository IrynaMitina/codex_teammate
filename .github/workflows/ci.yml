name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      DEBUG: 'false'
      STORAGE_BACKEND: local
      JWT_SECRET_KEY: ci-only-test-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run tests and enforce 80% coverage
        env:
          DATABASE_URL_TEMPLATE: sqlite+aiosqlite:///${{ runner.temp }}/drive-ci.db
          STORAGE_DIR: ${{ runner.temp }}/drive-ci-storage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80
